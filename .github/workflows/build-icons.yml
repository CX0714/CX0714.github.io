name: Build Icons
on:
  push:
    paths:
      - 'icon.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install librsvg
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate PNG icons
        run: |
          rsvg-convert -w 180 -h 180 icon.svg -o icon-180.png
          rsvg-convert -w 192 -h 192 icon.svg -o icon-192.png
          rsvg-convert -w 512 -h 512 icon.svg -o icon-512.png
          rsvg-convert -w 180 -h 180 icon.svg -o apple-touch-icon.png
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-180.png icon-192.png icon-512.png apple-touch-icon.png
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "chore: generate icon PNGs" && git push; fi
