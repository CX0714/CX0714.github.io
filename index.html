<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Philos</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f4f5f8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Philos">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 启动页 -->
    <div class="splash" id="splash">
        <div class="splash-planet">
            <div class="planet-glow"></div>
            <div class="planet-body"></div>
            <div class="planet-ring ring-front"></div>
        </div>
        <div class="splash-title">☆ Philos</div>
    </div>

    <!-- 主屏幕 -->
    <div class="screen desktop-view active" id="desktopView">
        <div class="desktop-wallpaper" id="desktopWallpaper"></div>
        <div class="desktop-content">
            
            <!-- 顶部大组件 (4行文字) -->
            <div class="widget-large" id="widgetLarge">
                <div class="widget-top" id="widgetTopBg"></div>
                <div class="widget-avatar" id="widgetAvatar">🌙</div>
                <div class="widget-bottom" id="widgetBottomBg">
                    <div class="widget-line-1" id="wLine1">______</div>
                    <div class="widget-line-2" id="wLine2">______</div>
                    <div class="widget-line-3" id="wLine3">______</div>
                    <div class="widget-line-4" id="wLine4">______</div>
                </div>
            </div>

            <!-- 中间图标区 -->
            <div class="icon-grid">
                <!-- 2x2 小组件区 -->
                <div class="widget-small" id="widgetSmallArea">
                    <div class="widget-small-inner" id="widgetSmallContent">
                        <!-- 动态渲染内容，默认放一个占位 -->
                        <div class="ws-placeholder">Select Widget</div>
                    </div>
                </div>
                
                <!-- 右侧 1x1 图标 -->
                <div class="app-grid-small">
                    <button class="app-icon btn-icon" id="appLetter">
                        <span class="app-icon-box"></span>
                        <span class="app-label">信箱</span>
                    </button>
                    <button class="app-icon btn-icon" id="appSettings">
                        <span class="app-icon-box"></span>
                        <span class="app-label">设置</span>
                    </button>
                    <button class="app-icon btn-icon" id="appCountdown">
                        <span class="app-icon-box"></span>
                        <span class="app-label">倒数日</span>
                    </button>
                    <button class="app-icon btn-icon" id="appWidgets">
                        <span class="app-icon-box"></span>
                        <span class="app-label">小组件</span>
                    </button>
                </div>
            </div>

            <!-- 底部 Dock 栏 -->
            <div class="dock">
                <button class="dock-icon" id="appChat"><span class="dock-label">聊天</span></button>
                <button class="dock-icon" id="appCards"><span class="dock-label">字卡</span></button>
                <button class="dock-icon" id="dockAppearance"><span class="dock-label">外观</span></button>
                <button class="dock-icon" id="dockPermission"><span class="dock-label">权限</span></button>
            </div>
        </div>
    </div>

    <!-- 聊天界面 -->
    <div class="screen chat-view" id="chatView">
        <header class="chat-header">
            <button class="glass-btn" id="btnChatBack">‹</button>
            <div class="chat-header-center">
                <div class="chat-header-avatar" id="headerAvatar">🌙</div>
                <div class="chat-header-name" id="headerName">他</div>
            </div>
            <button class="glass-btn" id="btnChatCall">📞</button>
        </header>
        <div class="chat-messages" id="chatMessages"></div>
        
        <!-- 底部悬浮输入区 -->
        <div class="chat-input-wrapper">
            <button class="glass-circle-btn" id="btnChatMore">+</button>
            <div class="chat-input-box">
                <textarea id="chatInput" rows="1" placeholder="发消息..."></textarea>
                <button class="send-btn-inner" id="btnChatSend">↑</button>
            </div>
        </div>
    </div>

    <!-- 设置系统界面 -->
    <div class="screen settings-view" id="settingsView">
        <div class="settings-main-page" id="settingsMainPage">
            <h1 class="nav-large-title">设置</h1>
            
            <!-- Philos 账户卡片 -->
            <div class="settings-card account-card" id="btnEditMyInfo">
                <div class="account-avatar" id="settingsMyAvatar">👤</div>
                <div class="account-info">
                    <div class="account-name" id="settingsMyName">your账户名</div>
                    <div class="account-sub">Philos 账户</div>
                </div>
                <div class="arrow-right">›</div>
            </div>

            <div class="settings-card group-card">
                <div class="settings-item" data-page="ta"><span>他的信息</span><span class="arrow-right">›</span></div>
                <div class="settings-item" data-page="bubble"><span>气泡</span><span class="arrow-right">›</span></div>
                <div class="settings-item" data-page="permission"><span>权限</span><span class="arrow-right">›</span></div>
            </div>

            <div class="settings-card group-card">
                <div class="settings-item" data-page="appearance"><span>外观</span><span class="arrow-right">›</span></div>
                <div class="settings-item" data-page="data"><span>数据管理</span><span class="arrow-right">›</span></div>
                <div class="settings-item" data-page="about"><span>关于</span><span class="arrow-right">›</span></div>
            </div>
        </div>
        
        <!-- 子页面容器（这里先预留，下一版写JS时再动态填充具体HTML，或先用隐藏div） -->
        <div class="settings-sub-page" id="settingsSubPage" style="display:none;">
            <header class="sub-header">
                <button class="glass-btn" id="btnSubBack">‹</button>
                <span class="sub-title" id="subPageTitle">标题</span>
                <span style="width:36px"></span>
            </header>
            <div class="sub-content" id="subPageContent">
                <!-- 内容将被JS动态注入或隐藏/显示对应的块 -->
            </div>
        </div>
    </div>

    <!-- 独立 App: 字卡 -->
    <div class="screen cards-view" id="cardsView">
        <header class="app-header">
            <button class="glass-btn" id="btnCardsBack">‹</button>
            <span class="app-title">字卡库</span>
            <button class="glass-btn" id="btnCardsMore">...</button>
        </header>
        <div class="app-content">
            <!-- 这里未来放 文字|emoji|表情包|状态 切换栏和列表 -->
            <div id="cardsListContainer"></div>
        </div>
    </div>

    <!-- 独立 App: 倒数日 -->
    <div class="screen countdown-view" id="countdownView">
        <header class="app-header">
            <button class="glass-btn" id="btnCountdownBack">‹</button>
            <span class="app-title">倒数日</span>
            <button class="glass-btn" id="btnCountdownAdd">+</button>
        </header>
        <div class="app-content" id="countdownListContainer">
            <!-- 倒数日列表 -->
        </div>
    </div>

    <!-- 独立 App: 信箱 -->
    <div class="screen letter-view" id="letterView">
        <header class="app-header">
            <button class="glass-btn" id="btnLetterBack">‹</button>
            <span class="app-title">信箱</span>
            <span style="width:36px"></span>
        </header>
        <div class="app-content" id="letterListContainer">
            <!-- 信件列表 -->
        </div>
    </div>

    <!-- 独立 App: 小组件 -->
    <div class="screen widgets-view" id="widgetsView">
        <header class="app-header">
            <button class="glass-btn" id="btnWidgetsBack">‹</button>
            <span class="app-title">小组件</span>
            <span style="width:36px"></span>
        </header>
        <div class="app-content" id="widgetsListContainer">
            <!-- 模板列表 -->
        </div>
    </div>

    <!-- 全局遮罩和弹窗占位 (JS后续控制) -->
    <div class="global-overlay" id="globalOverlay"></div>
    <div class="global-toast" id="globalToast"></div>

    <script src="app.js"></script>
</body>
</html>
