<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Philos</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#eef1f5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Philos">
    <script>
        /* 渲染前先定主题，避免闪白 */
        try {
            var _raw = localStorage.getItem('private_chat_app_v1');
            var _mode = 'auto';
            if (_raw) {
                var _data = JSON.parse(_raw);
                if (_data && _data.themeMode) _mode = _data.themeMode;
            }
            var _dark = _mode === 'dark' || (_mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', _dark ? 'dark' : 'light');
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ===== 线框图标库（1.5px，无 Emoji） ===== -->
    <svg class="svg-sprite" aria-hidden="true" focusable="false">
        <symbol id="ic-mail" viewBox="0 0 24 24">
            <rect x="3" y="5.5" width="18" height="13" rx="3.6"/>
            <path d="M4.2 8.4 12 13.4l7.8-5"/>
        </symbol>
        <symbol id="ic-gear" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3.1"/>
            <path d="M12 3.2v2.1M12 18.7v2.1M3.2 12h2.1M18.7 12h2.1M6 6l1.5 1.5M16.5 16.5 18 18M18 6l-1.5 1.5M7.5 16.5 6 18"/>
        </symbol>
        <symbol id="ic-calendar" viewBox="0 0 24 24">
            <rect x="3.5" y="5" width="17" height="15.5" rx="3.6"/>
            <path d="M3.5 10h17M8 3.2v3.6M16 3.2v3.6M8.2 14.2h2.2"/>
        </symbol>
        <symbol id="ic-grid" viewBox="0 0 24 24">
            <rect x="3.5" y="3.5" width="7" height="7" rx="2.2"/>
            <rect x="13.5" y="3.5" width="7" height="7" rx="2.2"/>
            <rect x="3.5" y="13.5" width="7" height="7" rx="2.2"/>
            <rect x="13.5" y="13.5" width="7" height="7" rx="2.2"/>
        </symbol>
        <symbol id="ic-back" viewBox="0 0 24 24">
            <path d="M14.5 5.5 8 12l6.5 6.5"/>
        </symbol>
        <symbol id="ic-chevron" viewBox="0 0 24 24">
            <path d="M9.5 5.5 16 12l-6.5 6.5"/>
        </symbol>
        <symbol id="ic-plus" viewBox="0 0 24 24">
            <path d="M12 5.5v13M5.5 12h13"/>
        </symbol>
        <symbol id="ic-up" viewBox="0 0 24 24">
            <path d="M12 19V5.5M6 11.5 12 5.5l6 6"/>
        </symbol>
        <symbol id="ic-phone" viewBox="0 0 24 24">
            <path d="M6.4 3.8h2.9l1.5 3.7-2 1.4a11.4 11.4 0 0 0 5.3 5.3l1.4-2 3.7 1.5v2.9a2.3 2.3 0 0 1-2.5 2.3A16.4 16.4 0 0 1 4.1 6.3 2.3 2.3 0 0 1 6.4 3.8z"/>
        </symbol>
    </svg>

    <!-- ===== 启动页 ===== -->
    <div class="splash" id="splash">
        <div class="splash-planet">
            <div class="planet-text">☆</div>
            <div class="planet-ring"></div>
        </div>
        <div class="splash-title">☆ Philos</div>
    </div>

    <!-- ===== 主屏幕 ===== -->
    <div class="screen desktop-view active" id="desktopView">
        <div class="desktop-content">

            <!-- 顶部大组件 -->
            <section class="widget-large" id="widgetLarge">
                <div class="widget-avatar" id="widgetAvatar">Me</div>
                <div class="widget-text-area" id="widgetTextArea" role="button" tabindex="0" aria-label="编辑主页文字">
                    <div class="widget-line widget-line-1" id="wLine1">______</div>
                    <div class="widget-line widget-line-2" id="wLine2">______</div>
                    <div class="widget-line widget-line-3" id="wLine3">______</div>
                    <div class="widget-line widget-line-4" id="wLine4">______</div>
                </div>
            </section>

            <!-- 中间图标区 -->
            <div class="icon-grid">
                <!-- 左侧 2x2 小组件（正方形） -->
                <div class="widget-small" id="widgetSmallArea">
                    <span class="ws-placeholder">Select Widget</span>
                </div>

                <!-- 右侧 4 个 1x1 图标 -->
                <div class="app-grid-small">
                    <button class="app-icon" id="appLetter" type="button">
                        <span class="app-icon-box">
                            <svg class="svg-icon" viewBox="0 0 24 24"><use href="#ic-mail"></use></svg>
                        </span>
                        <span class="app-label">信箱</span>
                    </button>
                    <button class="app-icon" id="appSettings" type="button">
                        <span class="app-icon-box">
                            <svg class="svg-icon" viewBox="0 0 24 24"><use href="#ic-gear"></use></svg>
                        </span>
                        <span class="app-label">设置</span>
                    </button>
                    <button class="app-icon" id="appCountdown" type="button">
                        <span class="app-icon-box">
                            <svg class="svg-icon" viewBox="0 0 24 24"><use href="#ic-calendar"></use></svg>
                        </span>
                        <span class="app-label">倒数日</span>
                    </button>
                    <button class="app-icon" id="appWidgets" type="button">
                        <span class="app-icon-box">
                            <svg class="svg-icon" viewBox="0 0 24 24"><use href="#ic-grid"></use></svg>
                        </span>
                        <span class="app-label">小组件</span>
                    </button>
                </div>
            </div>

            <!-- 底部 Dock -->
            <nav class="dock">
                <button class="dock-btn" id="appChat" type="button">聊天</button>
                <button class="dock-btn" id="appCards" type="button">字卡</button>
                <button class="dock-btn" id="dockAppearance" type="button">外观</button>
                <button class="dock-btn" id="dockPermission" type="button">权限</button>
            </nav>

        </div>
    </div>

    <!-- ===== 设置 ===== -->
    <div class="screen settings-view" id="settingsView">

        <!-- 主界面 -->
        <div class="settings-main" id="settingsMainPage">
            <div class="settings-topbar">
                <button class="nav-back" id="btnSettingsBack" type="button" aria-label="返回主屏幕">
                    <svg class="svg-icon" viewBox="0 0 24 24"><use href="#ic-back"></use></svg>
                </button>
            </div>

            <h1 class="nav-large-title">设置</h1>

            <button class="account-card" id="btnEditMyInfo" type="button">
                <span class="account-avatar" id="settingsMyAvatar">Me</span>
                <span class="account-info">
                    <span class="account-name" id="settingsMyName">your账户名</span>
                    <span class="account-sub">Philos 账户</span>
                </span>
                <svg class="svg-icon chevron" viewBox="0 0 24 24"><use href="#ic-chevron"></use></svg>
            </button>

            <div class="group-card">
                <button class="settings-item" data-sub="ta" type="button">
                    <span>他的信息</span>
                    <svg class="svg-icon chevron" viewBox="0 0 24 24"><use href="#ic-chevron"></use></svg>
                </button>
                <button class="settings-item" data-sub="bubble" type="button">
                    <span>气泡</span>
                    <svg class="svg-icon chevron" viewBox="0 0 24 24"><use href="#ic-chevron"></use></svg>
                </button>
                <button class="settings-item" data-sub="permission" type="button">
                    <span>权限</span>
                    <svg class="svg-icon chevron" viewBox="0 0 24 24"><use href="#ic-chevron"></use></svg>
                </button>
            </div>

            <div class="group-card">
                <button class="settings-item" data-sub="appearance" type="button">
                    <span>外观</span>
                    <svg class="svg-icon chevron" viewBox="0 0 24 24"><use href="#ic-chevron"></use></svg>
                </button>
                <button class="settings-item" data-sub="data" type="button">
                    <span>数据管理</span>
                    <svg class="svg-icon chevron" viewBox="0 0 24 24"><use href="#ic-chevron"></use></svg>
                </button>
                <button class="settings-item" data-sub="about" type="button">
                    <span>关于</span>
                    <svg class="svg-icon chevron" viewBox="0 0 24 24"><use href="#ic-chevron"></use></svg>
                </button>
            </div>
        </div>

        <!-- 二级页 -->
        <div class="settings-sub" id="settingsSubPage" hidden>
            <div class="settings-topbar">
                <button class="nav-back" id="btnSubBack" type="button" aria-label="返回">
                    <svg class="svg-icon" viewBox="0 0 24 24"><use href="#ic-back"></use></svg>
                </button>
                <span class="sub-title" id="subPageTitle"></span>
            </div>
            <div class="sub-content" id="subPageContent"></div>
        </div>

    </div>

    <!-- ===== 聊天 ===== -->
    <div class="screen chat-view" id="chatView">
        <header class="chat-header">
            <button class="glass-btn" id="btnChatBack" type="button" aria-label="返回">
                <svg class="svg-icon" viewBox="0 0 24 24"><use href="#ic-back"></use></svg>
            </button>
            <div class="chat-header-center">
                <div class="chat-header-avatar" id="headerAvatar">Me</div>
                <div class="chat-header-name" id="headerName">他</div>
            </div>
            <button class="glass-btn" id="btnChatCall" type="button" aria-label="通话">
                <svg class="svg-icon" viewBox="0 0 24 24"><use href="#ic-phone"></use></svg>
            </button>
        </header>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-wrapper">
            <button class="glass-square-btn" id="btnChatMore" type="button" aria-label="更多">
                <svg class="svg-icon" viewBox="0 0 24 24"><use href="#ic-plus"></use></svg>
            </button>
            <div class="chat-input-box">
                <textarea id="chatInput" rows="1" placeholder="发消息..."></textarea>
                <button class="send-btn-inner" id="btnChatSend" type="button" aria-label="发送">
                    <svg class="svg-icon" viewBox="0 0 24 24"><use href="#ic-up"></use></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ===== 字卡库 ===== -->
    <div class="screen cards-view" id="cardsView">
        <header class="app-header">
            <button class="glass-btn" id="btnCardsBack" type="button" aria-label="返回">
                <svg class="svg-icon" viewBox="0 0 24 24"><use href="#ic-back"></use></svg>
            </button>
            <span class="app-title">字卡库</span>
            <span class="header-spacer"></span>
        </header>
        <div class="app-content">
            <p class="empty-hint">字卡列表将在下个阶段更新。</p>
        </div>
    </div>

    <!-- ===== 倒数日 ===== -->
    <div class="screen countdown-view" id="countdownView">
        <header class="app-header">
            <button class="glass-btn" id="btnCountdownBack" type="button" aria-label="返回">
                <svg class="svg-icon" viewBox="0 0 24 24"><use href="#ic-back"></use></svg>
            </button>
            <span class="app-title">倒数日</span>
            <span class="header-spacer"></span>
        </header>
        <div class="app-content">
            <p class="empty-hint">倒数日列表将在下个阶段更新。</p>
        </div>
    </div>

    <!-- ===== 信箱 ===== -->
    <div class="screen letter-view" id="letterView">
        <header class="app-header">
            <button class="glass-btn" id="btnLetterBack" type="button" aria-label="返回">
                <svg class="svg-icon" viewBox="0 0 24 24"><use href="#ic-back"></use></svg>
            </button>
            <span class="app-title">信箱</span>
            <span class="header-spacer"></span>
        </header>
        <div class="app-content">
            <p class="empty-hint">信件列表将在下个阶段更新。</p>
        </div>
    </div>

    <!-- ===== 小组件 ===== -->
    <div class="screen widgets-view" id="widgetsView">
        <header class="app-header">
            <button class="glass-btn" id="btnWidgetsBack" type="button" aria-label="返回">
                <svg class="svg-icon" viewBox="0 0 24 24"><use href="#ic-back"></use></svg>
            </button>
            <span class="app-title">小组件</span>
            <span class="header-spacer"></span>
        </header>
        <div class="app-content">
            <p class="empty-hint">组件模板将在下个阶段更新。</p>
        </div>
    </div>

    <!-- ===== 主页文字编辑面板 ===== -->
    <div class="sheet-mask" id="sheetMask"></div>
    <div class="sheet" id="editSheet" role="dialog" aria-label="编辑主页文字">
        <div class="sheet-handle"></div>
        <div class="sheet-title">编辑主页文字</div>
        <div class="sheet-fields">
            <label class="sheet-field">
                <span>主标题</span>
                <input type="text" id="sheetLine1" maxlength="24" placeholder="______">
            </label>
            <label class="sheet-field">
                <span>标签</span>
                <input type="text" id="sheetLine2" maxlength="24" placeholder="______">
            </label>
            <label class="sheet-field">
                <span>引言</span>
                <input type="text" id="sheetLine3" maxlength="40" placeholder="______">
            </label>
            <label class="sheet-field">
                <span>地点</span>
                <input type="text" id="sheetLine4" maxlength="24" placeholder="______">
            </label>
        </div>
        <div class="sheet-actions">
            <button class="sheet-btn" id="sheetCancel" type="button">取消</button>
            <button class="sheet-btn primary" id="sheetSave" type="button">保存</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
